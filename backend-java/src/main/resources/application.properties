spring.application.name=clickguard-backend

# Base de datos H2 en memoria: los datos desaparecen al reiniciar.
spring.datasource.url=jdbc:h2:mem:clickguard
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# Configuración sustituible por variables de entorno.
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}
server.port=${SERVER_PORT:8080}